# Reference state of a fully set up machine. `py setup-state.py diff` compares
# the machine state (setup-state.yaml) with this file.
# Values: an exact string, "present" (any version), "any" (not checked).
# Only names, versions and presence are recorded, never secret values.
schema: 1
windows_tools:
  git: present
  pwsh: present
  python: present
  bd: present
  opencode: any
wsl:
  distro: Ubuntu-26.04
wsl_tools:
  git: present
  cargo: present
  node: present
  bun: present
  bd: present
  openspec: present
  docker: present
  codex: present
claude_config:
  claude_md: present
  settings_json: present
  instructions_count: "14"
  agents_count: "4"
opencode:
  config: present
  agents_md: present
  default_model: litellm/deepseek-flash
  permission_default: allow
  models: "deepseek-flash,deepseek-v4-pro"
codex:
  config_toml: present
  models_json: present
  instructions_md: present
  default_model: deepseek-flash
litellm:
  runtime_dir: present
  compose_yaml: present
  gateway_liveness: "200"
  deepseek_key_loaded: "yes"
env:
  UNIVERSAL_LOCAL_LITELLM_KEY: present
  UNIVERSAL_EXTERNAL_LITELLM_KEY: any
  wslenv_has_local_key: "yes"
git:
  identity_windows: "yes"
  identity_wsl: "yes"
  github_ssh_auth: "yes"
