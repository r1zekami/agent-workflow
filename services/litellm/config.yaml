# Aliases name the provider and model, so usage logs show who did the work.
# Prices are set explicitly (USD per token, DeepSeek peak rates): the bundled
# price map is used offline and may not know new models, and budgets need them.
model_list:
  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_KEY
    model_info:
      input_cost_per_token: 3.0e-07
      cache_read_input_token_cost: 6.0e-09
      output_cost_per_token: 1.2e-06

  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_KEY
    model_info:
      input_cost_per_token: 1.32e-06
      cache_read_input_token_cost: 4.4e-08
      output_cost_per_token: 3.96e-06

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Clients connect directly, no proxy in front: throttle admin UI sign-ins
  # per source address across usernames too.
  trusted_proxy_ranges: []
  # Admin UI accepts only database users (create a proxy_admin first, see
  # README); the master key keeps working for the API. Locked out: remove this.
  disable_env_credential_login: true
